name: Support request
description: Report a problem or request help with Zhiyu
title: "[Support] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for using Zhiyu. Please do not include precise location, calendar contents, account credentials, or other sensitive information.
  - type: input
    id: version
    attributes:
      label: Zhiyu version
      placeholder: e.g. 2026.09.28
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: iOS / iPadOS version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      description: Include the affected feature and steps to reproduce.
    validations:
      required: true
